<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELANORA Contact Form Submission</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h1 style="margin: 0;">ELANORA Contact Form</h1>
    </div>
    
    <div style="background-color: #f8fafc; padding: 20px; border-radius: 0 0 8px 8px;">
        <h2 style="margin-top: 0;">New Contact Message Received</h2>
        
        <div style="background-color: #ffffff; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; margin: 20px 0;">
            <p><span style="font-weight: bold; color: #374151;">From:</span> {sender_email}</p>
            <p><span style="font-weight: bold; color: #374151;">Request Type:</span> {request_type}</p>
            <p><span style="font-weight: bold; color: #374151;">Date:</span> {date}</p>
        </div>
        
        <div style="background-color: #ffffff; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap;">
            <h3 style="margin-top: 0;">Message:</h3>
            {message}
        </div>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b;">
            <p>This message was sent through the ELANORA contact form.</p>
            <p>Please respond directly to the sender's email address: {sender_email}</p>
            <p>© {year} ELANORA Platform</p>
        </div>
    </div>
</body>
</html>
